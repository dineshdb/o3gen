[package]
name = "o3gen-openai"
version = "0.5.0"
edition = "2024"
description = "OpenAI API client generated from the OpenAPI spec using o3gen"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/dineshdb/o3gen"
keywords = ["openai", "openapi", "generator", "client"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["reqwest"]
# The built-in HTTP backend. Disable (default-features = false) on
# targets reqwest cannot serve — a wasm component, say — and inject a
# Transport with OpenAIApiClient::with_transport instead.
reqwest = ["dep:reqwest", "dep:tokio", "dep:eventsource-stream", "dep:futures-util"]
test-utils = ["dep:mockito"]

[dependencies]
derive_builder = "0.20.2"
derive_more = { version = "2.1.1", features = ["display", "from"] }
eventsource-stream = { version = "0.2", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"], optional = true }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"], optional = true }
validator = { version = "0.20.0", features = ["derive"] }

[dependencies.mockito]
version = "1.7.2"
optional = true

[build-dependencies]
o3gen = { version = "0.9.0", path = "../o3gen" }

[dev-dependencies]
mockito = "1.7.2"
base64 = "0.22"
